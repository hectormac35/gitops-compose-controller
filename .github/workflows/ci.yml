name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests del controlador y la API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: controller/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Imagen y configuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Construir la imagen
        run: docker build -t gitops-compose-controller .
      - name: Docker Compose v2 disponible dentro de la imagen
        run: docker run --rm gitops-compose-controller docker compose version
      - name: Bootstrap del repo de estado deseado
        run: |
          ./scripts/bootstrap_env_repo.sh
          git -C repos/estado-deseado log --oneline
